trigger:
  branches:
    include:
      - main

variables:
  TF_WORKING_DIR: 'infra'

stages:
- stage: Infra
  jobs:
  - job: Terraform
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.7.5'

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(TF_WORKING_DIR)'
        backendServiceArm: 'AZURE_SUBSCRIPTION'  # Adjust if using a different service connection for backend

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: 'AZURE_SUBSCRIPTION'
        commandOptions: |
          -var="db_connection_string=$(DB_CONNECTION_STRING)"
          -var="storage_key=$(STORAGE_KEY)"
          -var="openai_endpoint=$(OPENAI_ENDPOINT)"
          -var="openai_key=$(OPENAI_KEY)"

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: 'AZURE_SUBSCRIPTION'
        commandOptions: |
          -var="db_connection_string=$(DB_CONNECTION_STRING)"
          -var="storage_key=$(STORAGE_KEY)"
          -var="openai_endpoint=$(OPENAI_ENDPOINT)"
          -var="openai_key=$(OPENAI_KEY)"
          -auto-approve