trigger:  # Se ejecuta manualmente
  branches:
    include:
      - main
      - dev

variables:
- group: openwebui  # Grupo de variables en Azure DevOps
- name: azureSubscription
  value: 'AZURE_SUBSCRIPTION'  # Reemplazar con el nombre de la suscripción de Azure DevOps
- name: containerAppName
  value: 'ca-clase2-esce'
- name: resourceGroupName
  value: 'RG_GRUPOEJEMPLOSNUEVOS_WESTEUROPE'
- name: registryUrl
  value: 'ghcr.io'     
- name: imageName
  value: 'open-webui/open-webui'         
- name: imageTag
  value: 'main'
- name: imageFullName
  value: '$(registryUrl)/$(imageName):$(imageTag)'

stages:
- stage: UpdateContainerApp
  displayName: 'Actualizar Container App con última imagen pública'
  jobs:
  - job: Update
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Instalando extensión containerapp si no existe..."
          az extension add --name containerapp --upgrade
          
          echo "Imagen a utilizar: $(imageFullName)"
          
          echo "Haciendo pull de la última imagen pública openwebui para evitar caché..."
          docker pull $(imageFullName)
          
          echo "Verificando imagen descargada..."
          docker images | grep "open-webui"
          
          echo "Actualizando Container App con la nueva imagen..."
          az containerapp update \
            --name $(containerAppName) \
            --resource-group $(resourceGroupName) \
            --image $(imageFullName) \
            --set-env-vars \
              "DATABASE_URL=$(DATABASE_URL)" \
              "DATA_DIR=$(DATA_DIR)" \
              "WEBUI_SECRET_KEY=$(WEBUI_SECRET_KEY)"
          
          echo "Container App actualizado exitosamente"
          
          echo "Limpiando imagen local para liberar espacio..."
          docker rmi $(imageFullName) || true