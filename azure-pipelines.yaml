# azure-pipelines-cd.yml: Pipeline de Entrega Continua (CD) con Terraform

trigger:
  branches:
    include:
      - main
      - dev

# Variables reutilizables
variables:
  TF_WORKING_DIR: 'infra'
  IMAGE_NAME: 'tallerdevops.azurecr.io/openwebui-custom:$(Build.BuildId)'
  ACR_SERVICE_CONNECTION: 'dockerRegistryServiceConnection'
  AZURE_SUBSCRIPTION: 'AZURE_SUBSCRIPTION' # Reemplazar con el nombre de tu Service Connection

# ----------------------------------------------------------------------
# STAGE 1: INFRA - Despliega o actualiza la infraestructura con Terraform
# ----------------------------------------------------------------------
stages:
- stage: Infra
  displayName: '1. Despliegue de Infraestructura (Terraform)'

  jobs:
  - job: TerraformApply
    displayName: 'Aplicar Infraestructura'
    demands:
      - Agent.Name -equals surface-laptop
    pool:
      name: 'LocalWindows'

    steps:
    - task: TerraformInstaller@1
      displayName: 'Instalar Terraform'
      inputs:
        terraformVersion: '1.7.5'

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(TF_WORKING_DIR)'
        backendServiceArm: '$(AZURE_SUBSCRIPTION)'

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'
        commandOptions: |
          -var="db_connection_string=$(DB_CONNECTION_STRING)"
          -var="storage_key=$(STORAGE_KEY)"

    - task: TerraformTask@5
      displayName: 'Terraform Apply y Guardar Salidas'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(TF_WORKING_DIR)'
        environmentServiceNameAzureRM: '$(AZURE_SUBSCRIPTION)'
        commandOptions: |
          -var="db_connection_string=$(DB_CONNECTION_STRING)"
          -var="storage_key=$(STORAGE_KEY)"
          -auto-approve
        outputServiceConnection: '$(AZURE_SUBSCRIPTION)'
        outputVariables: AZURE_WEBAPP_NAME

# ----------------------------------------------------------------------
# STAGE 2: DEPLOYAPP - Despliega el contenedor de OpenWebUI en la Infra creada
# ----------------------------------------------------------------------
- stage: DeployApp
  displayName: '2. Despliegue de Aplicación Contenedor'
  dependsOn: Infra

  jobs:
  - job: Deploy
    displayName: 'Desplegar OpenWebUI'
    demands:
      - Agent.Name -equals surface-laptop
    pool:
      name: 'LocalWindows'

    steps:
    - task: AzureRmWebAppDeployment@4
      displayName: 'Desplegar Imagen Docker y Configurar App'
      inputs:
        AzureSubscription: '$(AZURE_SUBSCRIPTION)'
        WebAppName: '$(AZURE_WEBAPP_NAME)'
        DeploymentType: 'Container'
        DockerImage: '$(IMAGE_NAME)'
        DockerRegistryServiceConnection: '$(ACR_SERVICE_CONNECTION)'
        AppSettings: |
          - AZURE_OPENAI_ENDPOINT $(OPENAI_ENDPOINT)
          - DB_HOST $(DB_HOST_FROM_TERRAFORM_OUTPUT)
          - PORT 8080